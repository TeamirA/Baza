{% extends "base.html" %}

{% block title %}Check your email{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Check your email</h1>
  <p class="muted">If an account uses that address, a reset link is on its way. It works for a limited time. Check your spam folder if you don't see it in a few minutes.</p>
  <p class="auth-card__switch"><a href="{% url 'login' %}">Back to log in</a></p>
</section>
{% endblock %}
