<div class="error-card" role="alert">
  <svg class="error-card__icon" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M12 7v6M12 16.5v.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </svg>
  <div>
    <p class="error-card__title">{{ title }}</p>
    <p class="error-card__message">{{ message }}</p>
  </div>
</div>
