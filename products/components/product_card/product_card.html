<article class="product-card">
  <a class="product-card__media" href="{{ product.url }}" tabindex="-1" aria-hidden="true">
    {% if product.image_url %}
      <img src="{{ product.image_url }}" alt="" loading="lazy">
    {% else %}
      <span class="product-card__placeholder">{{ product.name|slice:":1" }}</span>
    {% endif %}
  </a>
  <div class="product-card__body">
    {% if product.category %}<p class="product-card__category">{{ product.category.name }}</p>{% endif %}
    <h3 class="product-card__name"><a href="{{ product.url }}">{{ product.name }}</a></h3>
    <div class="product-card__footer">
      <span class="price">${{ product.price }}</span>
      {% if product.in_stock %}
        <span class="badge badge--ok">In stock</span>
      {% else %}
        <span class="badge badge--muted">Sold out</span>
      {% endif %}
    </div>
  </div>
</article>
